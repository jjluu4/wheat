{% load static %}
<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Profile</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="page">

        {% include '../navs/main.html' %}

        <div class="container">
            <h1>Edit profile</h1>

            <div class="card">
                <form method="post" data-pending-form>
                    {% csrf_token %}

                    <div class="field">
                        <label>Display name</label>
                        <input type="text" name="displayName" value="{{ author.displayName }}" />
                    </div>

                    <div class="field">
                        <label>GitHub URL</label>
                        <input type="url" name="github" value="{{ author.github }}" />
                    </div>

                    <div class="field">
                        <label>Description</label>
                        <textarea name="description" rows="4" cols="50">{{ author.description }}</textarea>
                    </div>

                    <div class="field">
                        <label>Profile image URL</label>
                        <input type="url" name="profileImage" value="{{ author.profileImage }}" />
                    </div>

                    <button type="submit">Save</button>
                    <a class="button-link" href="{% url 'author_profile' author.serial %}">Back</a>
                </form>
            </div>
        </div>

    </div>
</body>

</html>
