{% load static %}
<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>{{ author.displayName }}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/entry.js' %}?v=likes-ui-4"></script>
</head>

<body>
    <div class="page">

        {% include '../navs/main.html' %}

        <div class="container">
            <h1>{{ author.displayName }}'s Stream</h1>
            <div class="card">
                {% if entries %}
                <ul>
                    {% for entry in entries %}
                    {% include './fragments/entry.html' with entry=entry is_owner=is_owner %}
                    {% endfor %}
                </ul>
                {% else %}
                <p>No public entries yet.</p>
                {% endif %}
            </div>
        </div>

    </div>

    <script type="module" src="{% static 'js/markdown-renderer.js' %}?v=comments-md-3"></script>
</body>

</html>
