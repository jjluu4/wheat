{% load static %}
<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Authors</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="page">

        <div class="topnav">
            <div class="container">
                <a class="brand" href="{% url 'author_list' %}">
                    <span class="dot"></span> Wheat
                </a>

                <div class="navlinks">
                    <a href="{% url 'author_list' %}">Authors</a>
                    {% if request.user.is_authenticated %}
                    <a href="{% url 'my_stream' %}">My Stream</a>
                    <a href="{% url 'my_profile' %}">My Profile</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit">Logout</button>
                    </form>
                    {% else %}
                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'signup' %}">Sign up</a>
                    {% endif %}
                </div>
            </div>
        </div>

        <div class="container">
            <h1>Authors</h1>

            <div class="card">
                {% if authors %}
                <ul class="clean">
                    {% for a in authors %}
                    <li>
                        <a href="{% url 'author_profile' a.serial %}">{{ a.displayName }}</a>
                    </li>
                    {% endfor %}
                </ul>
                {% else %}
                <p>No authors yet.</p>
                {% endif %}
            </div>
        </div>

    </div>
</body>

</html>
