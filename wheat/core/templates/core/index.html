{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wheat – Social Distribution</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="page">

        {% include '../navs/main.html' %}

        <div class="container">
            <h1>Wheat</h1>
            <h2>Browse authors and their entries.</h2>
            <p><i>To be replaced with a proper landing page later</i></p>
            <br>
            <p>
                <a class="button-link" href="{% url 'author_list' %}">Browse authors</a>

                <a class="button-link" href="{% url 'signup' %}">Sign up</a>
                {% else %}
                <a class="button-link" href="{% url 'my_profile' %}">My profile</a>
                {% endif %}
            </p>
        </div>
    </div>
</body>
</html>
